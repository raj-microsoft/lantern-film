<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lantern — deterministic film project</title><link rel="stylesheet" href="style.css"><style>body{display:grid;place-items:center;min-height:100vh;padding:20px}main{width:min(1200px,100%)}canvas{display:block;width:100%;height:auto}form{display:flex;align-items:center;gap:16px;margin:20px 0;flex-wrap:wrap}input{flex:1;min-width:100px;accent-color:#f3bd61}button{font:inherit;background:#f3bd61;color:#20383f;border:0;padding:8px 20px;cursor:pointer}output{font-variant-numeric:tabular-nums}p{font-size:14px}body.render{padding:0;display:block}body.render main{width:100%}body.render canvas{width:100%}body.render form,body.render p{display:none}</style></head><body><main><canvas id="film-canvas" width="1920" height="1080" aria-label="Original Lantern animation. The full accessible transcript is on the main film page."></canvas><form onsubmit="return false"><button id="toggle" type="button">Play preview</button><label for="time">Seek</label><input id="time" type="range" min="0" max="29.966667" step="0.033333" value="2"><output id="readout" for="time">2.00 s</output></form><p>Deterministic browser project · four sub-frame exposure samples per rendered frame · captions stay sharp. Preview is silent; <a href="index.html">watch the mastered film and read the script</a>.</p></main><script src="src/film.js"></script></body></html>
